# Staging for Coolify: one process runs the API and the worker, migrations at boot.
# Its own Postgres resource (PostGIS); AI providers use cheap or replayed settings (phase 4).
services:
  app:
    image: ${IMAGE:-ghcr.io/pandeof1/manifest:staging}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ROLE: all
      MIGRATE_ON_BOOT: 'true'
      DATABASE_URL: ${DATABASE_URL:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      PUBLIC_URL: ${PUBLIC_URL:?}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: manifeste-staging
    expose:
      - '3000'
    deploy:
      resources:
        limits: { memory: 512m }
