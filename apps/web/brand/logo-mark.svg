<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Manifeste : un point d'exclamation dont la barre est un crayon, pointe en bas.
       Style affiche sérigraphiée : une encre (noir) sur fond rouge, coupes nettes. -->
  <rect width="512" height="512" fill="#ff453a"/>
  <g id="mark">
    <g transform="translate(256 258) scale(0.88) rotate(8) translate(-256 -258)">
      <!-- crayon : corps, cône taillé, mine -->
      <path fill="#0b0b0b" d="M206 36 L306 36 L306 296 L256 376 L206 296 Z"/>
      <!-- coupes couleur fond : virole, pans du corps, début de taille, mine -->
      <g stroke="#ff453a" fill="none">
        <path d="M206 70 L306 70" stroke-width="10"/>
        <path d="M240 80 L240 290 M272 80 L272 290" stroke-width="6"/>
        <path d="M206 296 L306 296" stroke-width="9"/>
        <path d="M234 344 L278 344" stroke-width="8"/>
      </g>
      <!-- le point -->
      <path fill="#0b0b0b" d="M212 402 L300 398 L304 478 L216 482 Z"/>
    </g>
  </g>
</svg>
