name: CodeQL

# Static analysis of the TypeScript code (injection, unsafe regexes, path handling…).
# Results appear under Security > Code scanning. A private repository needs GitHub Advanced Security
# for that, so the job is skipped there (it would fail on every push).
on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
