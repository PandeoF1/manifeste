name: Deploy

# develop -> the "Preview" environment (dev project), main -> the "Production" environment.
# Each GitHub environment holds its own SUPABASE_PROJECT_REF (secret or variable); see docs/ci-cd.md.
on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  supabase:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Warn when the environment is not configured
        if: ${{ env.SUPABASE_PROJECT_REF == '' }}
        run: echo "::warning::SUPABASE_PROJECT_REF is empty in this environment, nothing was deployed."
      - uses: supabase/setup-cli@v1
        if: ${{ env.SUPABASE_PROJECT_REF != '' }}
        with:
          version: latest
      - name: Link the project
        if: ${{ env.SUPABASE_PROJECT_REF != '' }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply new migrations
        if: ${{ env.SUPABASE_PROJECT_REF != '' }}
        run: supabase db push --linked --yes
      - name: Deploy Edge Functions
        if: ${{ env.SUPABASE_PROJECT_REF != '' }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
