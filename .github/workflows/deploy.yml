name: Deploy

# develop -> the "development" environment, main -> the "production" environment.
# Each GitHub environment holds its own SUPABASE_PROJECT_REF variable; see docs/ci-cd.md.
on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  supabase:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
        with:
          version: latest
      - name: Link the project
        if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Apply new migrations
        if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
        run: supabase db push --linked --yes
      - name: Deploy Edge Functions
        if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
        run: supabase functions deploy --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --use-api
