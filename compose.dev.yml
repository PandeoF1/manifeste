# Local development database (Postgres 17 + PostGIS), same port as the docs and tests expect:
#   docker compose -f compose.dev.yml up -d
# No Docker? Any Postgres 17 with PostGIS 3 works: see docs/development.md.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: manifeste_dev
    ports:
      - '54329:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
