# Local development database (Postgres 17 + PostGIS), same port as the docs and tests expect:
#   docker compose -f compose.dev.yml up -d
# No Docker? Any Postgres 17 with PostGIS 3 works: see docs/development.md.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: manifeste_dev
    ports:
      - '54329:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional S3-compatible storage for photos:  docker compose -f compose.dev.yml --profile s3 up -d
  # then BLOB_STORE=s3 S3_ENDPOINT=http://localhost:9000 S3_BUCKET=manifeste-dev
  #      S3_ACCESS_KEY_ID=minio S3_SECRET_ACCESS_KEY=miniominio S3_REGION=us-east-1
  # (console on http://localhost:9001). Tests: TEST_S3_ENDPOINT=http://localhost:9000
  # TEST_S3_BUCKET=manifeste-dev TEST_S3_KEY=minio TEST_S3_SECRET=miniominio
  minio:
    profiles: [s3]
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10
  minio-bucket:
    profiles: [s3]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minio miniominio &&
      mc mb --ignore-existing local/manifeste-dev"

volumes:
  db-data:
  minio-data:
